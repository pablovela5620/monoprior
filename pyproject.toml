[project]
name = "monopriors"
version = "0.3.2"
description = "Monocular Geometric Priors"
requires-python = ">=3.11.0"
readme = "README.md"

dependencies = [
    "geffnet>=1.0.2",
    "omnidata-tools>=0.0.23",
    "mmcv-lite>=2.2.0",
    "pytorch-lightning>=2.5.1,<3",
    "transformers",
    "diffusers[torch]>=0.32.2",
    "timm>=1.0.15,<2",
    "gradio-rerun>=0.24.0",
    "onnxruntime-gpu<1.23.0",
    "gradio==5.33.1",

    # pypi only

]

[tool.setuptools.packages.find]
include = ["monopriors*", "tools*"]

[tool.pixi.project]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.40"

[tool.pixi.pypi-options]

[tool.pixi.activation]
scripts = [".pixi.sh"]

[tool.pixi.tasks]
_install-wheel = "python -m pip install $WHL_PATH --force-reinstall"
_build-wheel = "python -m pip install build && python -m build"
_upload-pypi = "python -m pip install twine && twine check dist/*"
upload-hf = { cmd = "python tools/upload_to_hf.py", depends-on = [
    "_build-wheel",
] }

[tool.pixi.tasks._download-example]
cmd = """
    test -e data/example-room-scan-poly.zip
    || (
        huggingface-cli download pablovela5620/sample-polycam-room \
        example-room-scan-poly.zip --repo-type dataset \
        --local-dir data/
    )
    """
outputs = ["data/example-room-scan-poly.zip"]
description = "Downloads an example polycam dataset from huggingface"

[tool.pixi.tasks.polycam-inference]
cmd = """
    python tools/inference_polycam.py \
    --polycam-zip-path data/example-room-scan-poly.zip
    """
depends-on = ["_download-example"]
description = "Runs inference on polycam dataset on downloaded example, this will predict depths+normals"


[tool.pixi.tasks.vo]
cmd = """
    python tools/inference_polycam.py \
    --polycam-zip-path data/example-room-scan-poly.zip
    """
depends-on = ["_download-example"]
description = "Runs inference on polycam dataset on downloaded example, this will predict depths+normals"


[tool.pixi.dependencies]
python = "3.12.*"
# CUDA Build Tools
cuda-compiler = "*"
cuda-version = "12.8.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"

# CUDA Libraries
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
cusparselt = "*"
libnvjitlink = "*"
# cuda128 end
icecream = ">=2.1.3,<2.2"
jaxtyping = ">=0.2.36,<0.3"
einops = ">=0.8.0,<0.9"
matplotlib = ">=3.8.3,<3.9"
wandb = ">=0.19.10,<0.20"
pandas = ">=2.2.2,<2.3"
jupyterlab = ">=4.2.0,<4.3"
numpy = ">=2.0.0"
rerun-sdk = ">=0.24.1"
pyserde = ">=0.23.0,<0.24"
tyro = ">=0.9.1,<0.10"
open3d = ">=0.19.0,<0.20"
easydict = ">=1.13,<2"
imageio = ">=2.37.0,<3"
imageio-ffmpeg = ">=0.6.0,<0.7"
py-opencv = ">=4.10.0,<5"
hf-transfer = ">=0.1.9,<0.2"
scipy = ">=1.15.2,<2"
av = ">=15.1.0,<16"
natsort = ">=8.4.0,<9"


[tool.pixi.pypi-dependencies]
monopriors = { path = ".", editable = true }
simplecv = { git = "https://github.com/pablovela5620/simplecv.git", rev = "ab88369f5d0353ffb245de6d5981b0aede0930d7" }
torch = { version = ">=2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu128" }
# xformers = { version = "==0.0.30", index = "https://download.pytorch.org/whl/cu128" }
vggt = { git = "https://github.com/pablovela5620/vggt.git", rev = "5ed6ec88a951f27959f73bc72eb4b6dc7a028b0c" }
moge = { git = "https://github.com/microsoft/MoGe.git" }
rtmlib = { git = "https://github.com/pablovela5620/rtmlib.git", rev = "98bca2193c39b349034b280803b54c9ee58f7c68" }
sam-2 = { git = "https://github.com/facebookresearch/segment-anything-2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }


[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0.0,<9"
hypothesis = ">=6.0.0,<7"
beartype = ">=0.20"
pyrefly = ">=0.34.0,<0.35"


[tool.pixi.feature.dev.tasks.tests]
cmd = """
    pytest -q
    """
description = "Run the full test suite (quiet). Use: pixi run -e dev tests"


[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 150
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",  # Line too long.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "UP037", # Remove quotes from type, false positive when using jaxtyping
]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/*venv/**/*"]
